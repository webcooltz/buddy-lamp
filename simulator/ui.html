<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy Lamp Simulator</title>
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --bg: #14161c; --panel: #1d2029; --line: #2c303c; --text: #e6e8ee; --muted: #8b90a0;
    --red: #ff4d57; --blue: #4d8dff; --green: #3ddc84; --white: #f4f4f4; --ok: #3ddc84; --bad: #ff4d57;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { padding: 18px 20px 6px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  h1 { margin: 0; font-size: 20px; }
  header span { color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 16px 20px 28px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { margin: 0 0 2px; font-size: 16px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  svg { width: 100%; max-width: 240px; display: block; margin: 0 auto; }
  .led-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 4px 0 12px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.on { color: var(--text); border-color: currentColor; }
  button { font: inherit; color: var(--text); background: #2a2f3c; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: #343a4a; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button.big { display: block; width: 100%; padding: 12px; font-weight: 600; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow: auto; font-size: 13px; }
  li { padding: 4px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  li time { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .pill { font-weight: 600; }
  #banner { margin: 0 20px; padding: 8px 12px; border-radius: 8px; background: #3a1d22; color: #ffb3b8; display: none; }
  h3 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .warn { color: #ffb86b; border-color: #ffb86b; animation: pulse .5s ease-in-out 3; }
  @keyframes pulse { 50% { opacity: .35; } }
  .glow { transition: opacity .35s ease, fill .35s ease; }
  @keyframes flash { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
  .flash svg { animation: flash .7s ease-out; }
  @media (prefers-reduced-motion: reduce) { .flash svg { animation: none; } .glow { transition: none; } }
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="" width="44" height="44" style="align-self:center;border-radius:10px">
  <h1>Buddy Lamp Simulator</h1>
  <span>Virtual lamps run the real <code>client/lamp.py</code> against the real Node server.</span>
</header>
<div id="banner" role="status">Simulator backend not reachable.</div>
<main id="main"></main>

<script>
const COLORS = { red: '#ff4d57', blue: '#4d8dff', green: '#3ddc84', white: '#f4f4f4' };
const OFF = '#3a3f4e';
const main = document.getElementById('main');
const banner = document.getElementById('banner');
const lastSignature = {};

const post = (path, body) => fetch(path, { method: 'POST', body: JSON.stringify(body) }).then(refresh);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function lampSvg(leds) {
  const on = leds.filter((l) => l.on);
  // Blend: if both LEDs lit show both halves; otherwise single color
  const fill = on.length === 0 ? OFF : COLORS[on[0].color];
  const fill2 = on.length === 2 ? COLORS[on[1].color] : fill;
  return `<svg viewBox="0 0 200 240" role="img" aria-label="Lamp: ${on.length ? on.map((l) => l.color).join(' and ') + ' lit' : 'off'}">
    <defs>
      <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="${fill}"/><stop offset="1" stop-color="${fill2}"/></linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="${fill}" stop-opacity=".55"/><stop offset="1" stop-color="${fill}" stop-opacity="0"/></radialGradient>
    </defs>
    <circle class="glow" cx="100" cy="95" r="${on.length ? 95 : 0}" fill="url(#halo)"/>
    <path d="M60 170 Q40 95 100 40 Q160 95 140 170 Z" fill="${on.length ? 'url(#g)' : OFF}" stroke="#555b6e" stroke-width="3" class="glow"/>
    <rect x="55" y="170" width="90" height="14" rx="4" fill="#555b6e"/>
    <rect x="92" y="184" width="16" height="26" fill="#555b6e"/>
    <rect x="62" y="208" width="76" height="14" rx="6" fill="#555b6e"/>
  </svg>`;
}

function lampCard(l) {
  const chips = l.leds.map((led) =>
    `<span class="chip ${led.on ? 'on' : ''}" style="color:${led.on ? COLORS[led.color] : ''}">GPIO ${led.pin} · ${led.color} LED (${led.role}) ${led.on ? 'ON' : 'off'}</span>`).join('');
  const events = l.events.map((e) => `<li><time>${esc(e.t)}</time><span>${esc(e.text)}</span></li>`).join('') || '<li>No events yet</li>';
  return `<section class="panel" id="lamp${l.id}">
    <h2><span class="dot" style="background:${COLORS[l.color]}"></span>${esc(l.name)}'s lamp</h2>
    <div class="sub">family <b>${esc(l.family)}</b> · sends <b>${esc(l.color)}</b> · lamp thinks server color is <b>${esc(l.knownServerColor || 'unknown')}</b></div>
    ${lampSvg(l.leds)}
    <div class="led-row">${chips}${l.errorBlink ? '<span class="chip warn">⚠ error: LEDs blink twice</span>' : ''}</div>
    <button class="big" data-press="${l.id}">Press button (GPIO 2)</button>
    <h3>Lamp log</h3><ul>${events}</ul>
  </section>`;
}

function serverCard(s) {
  const msgs = s.messages.map((m) =>
    `<li><time>#${m.id}</time><span>${esc(m.household?.name || '—')} → <b style="color:${COLORS[m.household?.color] || ''}">${esc(m.household?.color || 'none')}</b></span></li>`).join('') || '<li>No messages (server color is white)</li>';
  return `<section class="panel" id="server">
    <h2><span class="dot" style="background:${s.running ? 'var(--ok)' : 'var(--bad)'}"></span>Server</h2>
    <div class="sub">${esc(s.url)} · family <b>${esc(s.family)}</b> · ${s.running ? 'running' : 'STOPPED'} · current color
      <span class="pill" style="color:${COLORS[s.color]}">${esc(s.color)}</span></div>
    <div class="btns">
      <button data-server="${s.running ? 'stop' : 'start'}">${s.running ? 'Stop server (simulate outage)' : 'Start server'}</button>
      <button data-server="reset">Reset messages</button>
    </div>
    <h3>Messages (newest first)</h3><ul>${msgs}</ul>
  </section>`;
}

async function refresh() {
  let state;
  try {
    state = await (await fetch('/api/state', { cache: 'no-store' })).json();
    banner.style.display = 'none';
  } catch (e) {
    banner.style.display = 'block';
    return;
  }
  // Don't rebuild while a list is being scrolled/hovered? Keep simple: rebuild only on change.
  const sig = JSON.stringify(state);
  if (sig === lastSignature.all) return;
  const previous = JSON.parse(lastSignature.all || 'null');
  lastSignature.all = sig;
  const scroll = [...main.querySelectorAll('ul')].map((u) => u.scrollTop);
  main.innerHTML = state.lamps.map(lampCard).join('') + serverCard(state.server);
  main.querySelectorAll('ul').forEach((u, i) => { u.scrollTop = scroll[i] || 0; });
  // Flash lamps whose LEDs changed
  state.lamps.forEach((l, i) => {
    const before = previous && previous.lamps[i];
    if (before && JSON.stringify(before.leds) !== JSON.stringify(l.leds)) {
      const el = document.getElementById('lamp' + l.id);
      el.classList.add('flash');
    }
  });
}

main.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.press !== undefined) post('/api/press', { lamp: Number(b.dataset.press) });
  if (b.dataset.server) post('/api/server', { action: b.dataset.server });
});

refresh();
setInterval(refresh, 500);
</script>
</body>
</html>
